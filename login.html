<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | キャッシュレス管理システム</title>
<style>
  :root {
    --bg-page: #f5f3ee;
    --bg-card: #fbfaf6;
    --bg-form: #eee9dc;
    --bg-white: #ffffff;
    --bg-notice: #fbeed5;
    --bg-notice-border: #f1d9a0;
    --border-color: #e8e4da;
    --border-input: #d8d4c8;
    --border-form: #e2dcc8;
    --text-main: #2a2a2a;
    --text-sub: #4a4a4a;
    --text-label: #5a5a5a;
    --text-muted: #8a8a8a;
    --text-notice: #8a5a1a;
    --accent-blue: #3a6db5;
    --accent-blue-light: #e3edfb;
    --accent-blue-border: #b9d0ec;
    --accent-blue-hover: #d5e4f6;
    --error-red: #c64a4a;
    --error-bg: #fbeaea;
    --error-border: #f0c4c4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background-color: var(--bg-page);
    color: var(--text-main);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .login-container {
    width: 100%;
    max-width: 460px;
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 40px 44px 36px;
  }

  /* ヘッダー */
  .login-header {
    text-align: center;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 28px;
  }

  .system-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }

  .system-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  /* ログインフォームエリア */
  .login-form-box {
    background-color: var(--bg-form);
    border: 1px solid var(--border-form);
    border-radius: 8px;
    padding: 24px 26px 22px;
    margin-bottom: 20px;
  }

  .form-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }

  .form-label {
    font-size: 12px;
    color: var(--text-label);
  }

  .login-input {
    padding: 10px 14px;
    border: 1px solid var(--border-input);
    border-radius: 6px;
    background-color: var(--bg-white);
    font-size: 14px;
    color: var(--text-main);
    font-family: "SFMono-Regular", "Consolas", "Menlo", monospace;
    width: 100%;
    transition: all 0.15s ease;
  }

  .login-input.jp {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
  }

  .login-input:focus {
    outline: none;
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 2px rgba(58, 109, 181, 0.15);
  }

  /* 入力チェックでエラーになった項目のハイライト */
  .login-input.input-error {
    border-color: var(--error-red);
    background-color: var(--error-bg);
  }

  .login-input.input-error:focus {
    border-color: var(--error-red);
    box-shadow: 0 0 0 2px rgba(198, 74, 74, 0.18);
  }

  /* パスワード表示切替 */
  .password-wrapper {
    position: relative;
  }

  .password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    font-size: 12px;
    color: var(--text-muted);
    font-family: inherit;
    border-radius: 4px;
    transition: all 0.15s ease;
  }

  .password-toggle:hover {
    background-color: rgba(0,0,0,0.04);
    color: var(--text-sub);
  }

  .login-input.has-toggle {
    padding-right: 56px;
  }

  /* ログインボタン */
  .btn-login {
    width: 100%;
    background-color: var(--accent-blue-light);
    border: 1px solid var(--accent-blue-border);
    color: var(--accent-blue);
    font-weight: 500;
    padding: 11px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-login:hover {
    background-color: var(--accent-blue-hover);
  }

  .btn-login:active {
    transform: translateY(1px);
  }

  /* エラーメッセージ (非表示状態) */
  .error-message {
    display: none;
    background-color: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--error-red);
    margin-bottom: 14px;
    align-items: center;
    gap: 8px;
  }

  .error-message.show {
    display: flex;
  }

  .error-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--error-red);
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* 注意書きボックス */
  .notice-box {
    background-color: var(--bg-notice);
    border: 1px solid var(--bg-notice-border);
    border-radius: 8px;
    padding: 14px 18px 16px;
  }

  .notice-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-notice);
    margin-bottom: 8px;
  }

  .notice-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--text-notice);
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
  }

  .notice-text {
    font-size: 12px;
    color: var(--text-notice);
    line-height: 1.7;
  }

  /* フッター */
  .login-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    body { padding: 16px 8px; }
    .login-container { padding: 28px 22px 24px; }
    .login-form-box { padding: 20px 18px; }
    .system-title { font-size: 19px; }
  }
</style>
</head>
<body>
  <div class="login-container">
    <!-- ヘッダー -->
    <div class="login-header">
      <h1 class="system-title">キャッシュレス管理システム</h1>
      <p class="system-subtitle">Cashless Management System</p>
    </div>

    <!-- エラーメッセージ -->
    <div class="error-message" id="error-message">
      <span class="error-icon">!</span>
      <span id="error-text">メールアドレスまたはパスワードが正しくありません。</span>
    </div>

    <!-- ログインフォーム -->
    <div class="login-form-box">
      <div class="form-field">
        <label class="form-label" for="email">メールアドレス</label>
        <input
          type="email"
          id="email"
          class="login-input"
          placeholder="例: name@example.com"
          autocomplete="email"
        />
      </div>

      <div class="form-field" style="margin-bottom: 22px">
        <label class="form-label" for="password">パスワード</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            class="login-input has-toggle"
            placeholder="パスワードを入力"
            autocomplete="current-password"
          />
          <button type="button" class="password-toggle" id="password-toggle">表示</button>
        </div>
      </div>

      <button type="button" class="btn-login" id="btn-login">
        <span>🔒</span><span>ログイン</span>
      </button>
    </div>

    <!-- 注意書き -->
    <div class="notice-box">
      <div class="notice-title">
        <span class="notice-icon">!</span>
        <span>ログイン時のご注意</span>
      </div>
      <p class="notice-text">
        パスワードを連続して5回間違えた場合、アカウントが一時的にロックされます。ログインできない場合は、システム管理者までお問い合わせください。
      </p>
    </div>

    <!-- フッター -->
    <div class="login-footer">
      © 2026 Cashless Management System. All rights reserved.
    </div>
  </div>

  <script>
    // パスワード表示切替
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('password-toggle');

    passwordToggle.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        passwordToggle.textContent = '隠す';
      } else {
        passwordInput.type = 'password';
        passwordToggle.textContent = '表示';
      }
    });

    // ログインフォームの入力チェック
    const emailInput = document.getElementById('email');
    const errorMessage = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    const btnLogin = document.getElementById('btn-login');

    // メールアドレスの形式不正に共通で使うメッセージ
    const EMAIL_FORMAT_MESSAGE =
        'メールアドレスの形式が正しくありません。'
        + '（例：user@example.com の形式で入力してください）';

    function showError(text) {
      errorText.textContent = text;
      errorMessage.classList.add('show');
    }

    function hideError() {
      errorMessage.classList.remove('show');
    }

    // エラーになった入力欄にハイライトを付ける・解除する
    function setFieldError(input) {
      input.classList.add('input-error');
    }

    function clearFieldErrors() {
      emailInput.classList.remove('input-error');
      passwordInput.classList.remove('input-error');
    }

    // メールアドレスの入力チェック (チェック1)
    // 戻り値: エラーメッセージ。問題が無ければ null
    function validateEmail(email) {
      // 1-3: 未入力 (半角・全角スペースのみはトリム後に空文字となる)
      if (email === '') {
        return 'メールアドレスを入力してください。';
      }
      // 14: 全角文字 (ASCII 以外) が含まれる
      if (/[^\x00-\x7F]/.test(email)) {
        return 'メールアドレスは半角で入力してください。';
      }
      // 13: 使用できない文字 (許可するのは半角英数字と . _ - + @)
      if (/[^A-Za-z0-9._+\-@]/.test(email)) {
        return 'メールアドレスに使用できない文字が含まれています。'
            + '半角英数字と記号（. _ - + @）で入力してください。';
      }
      // 5-6: @ が無い / 複数ある
      const atParts = email.split('@');
      if (atParts.length !== 2) {
        return EMAIL_FORMAT_MESSAGE;
      }
      const localPart = atParts[0];
      const domainPart = atParts[1];
      // 7-8: ローカル部・ドメイン部が空
      if (localPart === '' || domainPart === '') {
        return EMAIL_FORMAT_MESSAGE;
      }
      // 9: ドットが連続している
      if (email.indexOf('..') !== -1) {
        return EMAIL_FORMAT_MESSAGE;
      }
      // 10: ローカル部・ドメイン部の先頭または末尾がドット
      if (localPart.charAt(0) === '.'
          || localPart.charAt(localPart.length - 1) === '.'
          || domainPart.charAt(0) === '.'
          || domainPart.charAt(domainPart.length - 1) === '.') {
        return EMAIL_FORMAT_MESSAGE;
      }
      // 11: ドメインにドットが無い
      if (domainPart.indexOf('.') === -1) {
        return EMAIL_FORMAT_MESSAGE;
      }
      // 12: TLD (最後のドット以降) が英字2文字以上でない
      const tld = domainPart.substring(domainPart.lastIndexOf('.') + 1);
      if (!/^[A-Za-z]{2,}$/.test(tld)) {
        return EMAIL_FORMAT_MESSAGE;
      }
      // 15: 全体が254文字を超過
      if (email.length > 254) {
        return 'メールアドレスは254文字以内で入力してください。';
      }
      // 16: ローカル部 (@より前) が64文字を超過
      if (localPart.length > 64) {
        return 'メールアドレスの@より前は64文字以内で入力してください。';
      }
      // 17: 8文字未満
      if (email.length < 8) {
        return 'メールアドレスは8文字以上で入力してください。';
      }
      return null;
    }

    // パスワードの入力チェック (チェック2)
    // 戻り値: エラーメッセージ。問題が無ければ null
    // ※パスワードは前後の空白も有効文字として扱うためトリムしない
    function validatePassword(password) {
      // 1-3: 未入力 (半角・全角スペースのみは空とみなす)
      if (password.trim() === '') {
        return 'パスワードを入力してください。';
      }
      // 4: 半角英数記号以外 (ASCII 以外) が含まれる
      if (/[^\x00-\x7F]/.test(password)) {
        return 'パスワードは半角英数字と記号で入力してください。';
      }
      // 6: 使用できない文字 (空白や制御文字など表示可能な ASCII 記号以外)
      if (/[^\x21-\x7E]/.test(password)) {
        return 'パスワードに使用できない文字が含まれています。'
            + '使用可能な文字：半角英数字と記号（! @ # $ % など）';
      }
      // 7-8: 8文字以上20文字以内
      if (password.length < 8 || password.length > 20) {
        return 'パスワードは8文字以上20文字以内で入力してください。';
      }
      // 5: 英大文字・英小文字・数字・記号をそれぞれ1文字以上含む
      const hasUpper = /[A-Z]/.test(password);
      const hasLower = /[a-z]/.test(password);
      const hasDigit = /[0-9]/.test(password);
      const hasSymbol = /[^A-Za-z0-9]/.test(password);
      if (!hasUpper || !hasLower || !hasDigit || !hasSymbol) {
        return 'パスワードは英大文字・英小文字・数字・記号を'
            + 'それぞれ1文字以上含めて入力してください。';
      }
      return null;
    }

    btnLogin.addEventListener('click', () => {
      hideError();
      clearFieldErrors();

      // メールアドレスは前後の空白をトリムし、入力欄にも反映する
      const email = emailInput.value.trim();
      emailInput.value = email;
      const password = passwordInput.value;

      // チェック2 No.9: メールアドレスとパスワードがどちらも未入力
      if (email === '' && password.trim() === '') {
        showError('メールアドレスとパスワードを入力してください。');
        setFieldError(emailInput);
        setFieldError(passwordInput);
        emailInput.focus();
        return;
      }

      const emailError = validateEmail(email);
      if (emailError !== null) {
        showError(emailError);
        setFieldError(emailInput);
        emailInput.focus();
        return;
      }

      const passwordError = validatePassword(password);
      if (passwordError !== null) {
        showError(passwordError);
        setFieldError(passwordInput);
        passwordInput.focus();
        return;
      }

      // 形式チェック通過後、サーバーで m_employee の登録内容と照合する
      authenticateWithServer(email, password);
    });

    // メールアドレスとパスワードをサーバーへ送信し、m_employee との
    // 照合結果に応じてメニューへ遷移、またはエラーメッセージを表示する。
    // チェック1 No.18-20 (未登録・無効・ロック中) はサーバー側で判定する。
    function authenticateWithServer(email, password) {
      btnLogin.disabled = true;
      fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      })
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          if (data.success) {
            window.location.href = '/menu';
            return;
          }
          showError(data.message);
          setFieldError(emailInput);
          setFieldError(passwordInput);
          btnLogin.disabled = false;
        })
        .catch(function () {
          showError('通信エラーが発生しました。時間をおいて再度お試しください。');
          btnLogin.disabled = false;
        });
    }

    // Enterキーでログイン
    [emailInput, passwordInput].forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          btnLogin.click();
        }
      });
      // 再入力されたらエラー表示とハイライトを解除する
      input.addEventListener('input', () => {
        hideError();
        clearFieldErrors();
      });
    });
  </script>
</body>
</html>
