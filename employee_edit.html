<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>社員登録・更新</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic", "Meiryo", sans-serif;
    background: #F5F4EF;
    color: #1f1f1e;
    padding: 40px;
    width: 1100px;
  }
  .container {
    background: #FAF9F5;
    border-radius: 16px;
    padding: 28px 32px;
    border: 0.5px solid rgba(0,0,0,0.08);
  }

  .back-bar {
    margin-bottom: 16px;
    text-align: right;
  }
  .btn {
    height: 36px;
    padding: 0 18px;
    border: 0.5px solid rgba(0,0,0,0.15);
    background: #fff;
    border-radius: 8px;
    font-size: 13px;
    color: #1f1f1e;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary {
    background: #E6F1FB;
    color: #185FA5;
    border-color: rgba(24,95,165,0.3);
    font-weight: 500;
  }
  .btn-success {
    background: #E1F5EE;
    color: #0F6E56;
    border-color: rgba(15,110,86,0.3);
    font-weight: 500;
  }
  .btn-danger {
    background: #FDF4F4;
    color: #B33A3A;
    border-color: rgba(179,58,58,0.3);
    font-weight: 500;
  }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 0.5px solid rgba(0,0,0,0.1);
  }
  .page-title { font-size: 18px; font-weight: 500; }

  .mode-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 8px;
    font-weight: 500;
  }
  .mode-badge.edit { color: #185FA5; background: #E6F1FB; }
  .mode-badge.new { color: #0F6E56; background: #E1F5EE; }

  /* フォームエリア */
  .form-area {
    background: #fff;
    border: 0.5px solid rgba(0,0,0,0.12);
    border-radius: 12px;
    padding: 28px 32px;
    margin-bottom: 20px;
  }
  .form-section-title {
    font-size: 13px;
    font-weight: 500;
    color: #185FA5;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 0.5px solid #E6F1FB;
  }
  .form-row {
    display: flex;
    gap: 16px;
    margin-bottom: 18px;
  }
  .form-row:last-child { margin-bottom: 0; }
  .form-field { flex: 1; }
  .form-field.half { flex: 0 0 calc(50% - 8px); }
  .form-field.third { flex: 0 0 calc(33% - 11px); }
  .form-field label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #6b6b68;
    margin-bottom: 8px;
  }
  .required {
    font-size: 10px;
    color: #B33A3A;
    background: #FDF4F4;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 500;
  }
  .form-field input,
  .form-field select {
    width: 100%;
    height: 38px;
    padding: 0 12px;
    border: 0.5px solid rgba(0,0,0,0.15);
    border-radius: 8px;
    background: #fff;
    font-size: 14px;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
  }
  .form-field input.mono {
    font-family: 'SFMono-Regular', 'Menlo', 'Consolas', monospace;
  }
  .field-hint {
    font-size: 11px;
    color: #8a8a86;
    margin-top: 6px;
  }
  .select-wrap {
    position: relative;
  }
  .select-wrap .select-arrow {
    position: absolute;
    right: 14px;
    top: 14px;
    pointer-events: none;
  }

  /* アクションバー */
  .action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #FAF9F5;
    border: 0.5px solid rgba(0,0,0,0.12);
    border-radius: 12px;
    padding: 16px 20px;
  }
  .action-left, .action-right {
    display: flex;
    gap: 10px;
  }

  /* 注意事項 */
  .notice {
    background: #FAEEDA;
    border-radius: 12px;
    padding: 14px 18px;
    margin-top: 16px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 12px;
    color: #854F0B;
  }
  .notice svg { flex-shrink: 0; margin-top: 1px; }
  .notice-text { line-height: 1.6; }
  .notice-text strong { font-weight: 500; }
</style>
</head>
<body>
  <div class="container">

    <div class="back-bar">
      <button class="btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        戻る
      </button>
    </div>

    <div class="page-header">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div class="page-title">社員情報 編集</div>
        <span class="mode-badge edit">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          更新モード
        </span>
      </div>
    </div>

    <!-- フォーム -->
    <div class="form-area">
      <div class="form-section-title">基本情報</div>

      <div class="form-row">
        <div class="form-field third">
          <label>社員番号 <span class="required">必須</span></label>
          <input type="text" class="mono" value="S001" readonly style="background: #F1EFE8; color: #6b6b68;">
          <div class="field-hint">自動採番されます</div>
        </div>
        <div class="form-field third">
          <label>社員名 <span class="required">必須</span></label>
          <input type="text" value="田中 一郎">
        </div>
        <div class="form-field third">
          <label>社員名 (カナ) <span class="required">必須</span></label>
          <input type="text" value="タナカ イチロウ">
        </div>
      </div>

      <div class="form-row">
        <div class="form-field third">
          <label>部署 <span class="required">必須</span></label>
          <div class="select-wrap">
            <select>
              <option>営業部</option>
              <option>システム開発部</option>
              <option>経理部</option>
              <option>総務部</option>
            </select>
            <svg class="select-arrow" width="10" height="10" viewBox="0 0 10 10"><path d="M1 3.5 L5 7 L9 3.5" stroke="#6b6b68" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
          </div>
        </div>
        <div class="form-field third">
          <label>電話番号 <span class="required">必須</span></label>
          <input type="text" class="mono" value="03-1234-5678">
          <div class="field-hint">半角数字とハイフンで入力してください</div>
        </div>
        <div class="form-field third">
          <label>FAX</label>
          <input type="text" class="mono" value="03-1234-5679">
          <div class="field-hint">任意項目です</div>
        </div>
      </div>
    </div>

    <!-- アクションバー -->
    <div class="action-bar">
      <div class="action-left">
        <button class="btn btn-danger">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          削除
        </button>
      </div>
      <div class="action-right">
        <button class="btn">キャンセル</button>
        <button class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          更新
        </button>
      </div>
    </div>

    <!-- 注意事項 -->
    <div class="notice">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#854F0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <div class="notice-text">
        <strong>削除を行う場合のご注意:</strong> 削除した社員情報は復元できません。実行前に確認ダイアログが表示されます。新規登録の場合、社員番号は自動採番のため変更できません。
      </div>
    </div>

  </div>
</body>
</html>
