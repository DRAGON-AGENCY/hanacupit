<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- CSRF トークン。更新系の要求でヘッダーに設定して送信する。 -->
<meta name="csrf-token" th:content="${csrfToken}" content="">
<title>手数料率管理 編集 | キャッシュレス管理システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 外部フォント CSS はレンダリングをブロックしないよう非同期で読み込む。 -->
<!-- 取得前でも代替フォントで即座に画面を表示し、応答性を確保する。 -->
<link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
    media="print" onload="this.media='all'">
<noscript>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
</noscript>
<style>
  :root {
    /* === 色トークン (他画面と統一) === */
    --bg-page: #ffffff;
    --bg-card: #ffffff;
    --bg-form: #fbf4e7;
    --bg-label: #ede8db;
    --bg-white: #ffffff;
    --bg-hover: #faf8f2;
    --bg-readonly: #f1efe8;
    --bg-notice: #fbeed5;
    --bg-notice-border: #f1d9a0;
    --border-color: #e8e4da;
    --border-input: #d8d4c8;
    --border-form: #ecd9b0;
    --border-table: #e5e2d8;
    --text-main: #2a2a2a;
    --text-sub: #4a4a4a;
    --text-label: #5a5a5a;
    --text-muted: #8a8a8a;
    --text-notice: #8a5a1a;
    --accent: #b07a28;
    --accent-light: #faeeda;
    --accent-border: #ecd9b0;
    --danger: #b33a3a;
    --danger-light: #fdf4f4;
    --danger-border: #e6c4c4;

    /* === フォントトークン === */
    --font-jp: "Inter", "Noto Sans JP", sans-serif;
    --font-base: "Inter", "Noto Sans JP", sans-serif;
    --font-mono: "SFMono-Regular", "Consolas", "Menlo", monospace;

    /* === フォントサイズトークン === */
    --fs-xs: 14px;
    --fs-sm: 15px;
    --fs-base: 16px;
    --fs-md: 18px;
    --fs-lg: 22px;

    /* === レイアウトトークン === */
    --container-min: 1200px;
    --container-max: 1760px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  [hidden] {
    display: none !important;
  }

  html, body {
    min-height: 100vh;
  }

  body {
    font-family: var(--font-base);
    background-color: var(--bg-page);
    color: var(--text-main);
    padding: 0;
    min-height: 100vh;
    overflow-x: auto;
    overflow-y: auto;
    -webkit-font-smoothing: antialiased;
    font-size: var(--fs-base);
    font-feature-settings: "palt";
  }

  .container {
    min-width: var(--container-min);
    max-width: var(--container-max);
    width: 100%;
    margin: 0 auto;
    background-color: var(--bg-card);
    border: none;
    border-radius: 0;
    padding: 10px 32px 14px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ページ全体のカスタムスクロールバー */
  body::-webkit-scrollbar {
    width: 14px;
  }

  body::-webkit-scrollbar-track {
    background: var(--bg-page);
    border-left: 1px solid var(--border-table);
  }

  body::-webkit-scrollbar-thumb {
    background: #c9c4b4;
    border: 3px solid var(--bg-page);
    border-radius: 8px;
  }

  body::-webkit-scrollbar-thumb:hover {
    background: #aea892;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 14px;
  }

  .page-title {
    font-size: var(--fs-lg);
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: 0.01em;
  }

  .mode-indicator {
    font-size: var(--fs-sm);
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .mode-indicator:empty {
    display: none;
  }

  /* フォームエリア */
  .form-box {
    background-color: var(--bg-form);
    border: 1px solid var(--border-form);
    border-radius: 8px;
    padding: 18px 22px;
    margin-bottom: 14px;
  }

  .form-section-title {
    font-size: var(--fs-sm);
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--accent-border);
    letter-spacing: 0.02em;
  }

  .form-row {
    display: flex;
    gap: 18px;
    margin-bottom: 18px;
  }

  .form-row:last-child {
    margin-bottom: 0;
  }

  .form-field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-field label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: var(--fs-xs);
    font-weight: 600;
    color: var(--text-label);
    letter-spacing: 0.03em;
  }

  .required {
    font-size: 12px;
    color: var(--danger);
    background: var(--danger-light);
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }

  .form-field input,
  .form-field select {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--border-input);
    border-radius: 6px;
    background-color: var(--bg-white);
    font-size: var(--fs-base);
    font-family: var(--font-jp);
    color: var(--text-main);
    appearance: none;
    -webkit-appearance: none;
  }

  .form-field input:focus,
  .form-field select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(176, 122, 40, 0.15);
  }

  .form-field input.mono {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .field-hint {
    font-size: 12px;
    color: var(--text-muted);
  }

  .select-wrap {
    position: relative;
  }

  .select-wrap .select-arrow {
    position: absolute;
    right: 14px;
    top: 15px;
    pointer-events: none;
  }

  /* アクションバー */
  .action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: var(--bg-white);
    border: 1px solid var(--border-table);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 14px;
  }

  .action-left,
  .action-right {
    display: flex;
    gap: 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 20px;
    border-radius: 6px;
    font-size: var(--fs-base);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
    border: 1px solid var(--border-input);
    background-color: var(--bg-white);
    color: var(--text-main);
    font-weight: 500;
  }

  .btn:hover {
    background-color: var(--bg-hover);
    border-color: #c4bfae;
  }

  .btn-primary {
    background-color: var(--accent-light);
    border-color: var(--accent-border);
    color: var(--accent);
  }

  .btn-primary:hover {
    background-color: #f3e2c4;
    border-color: var(--accent);
  }

  .btn-danger {
    background-color: var(--danger-light);
    border-color: var(--danger-border);
    color: var(--danger);
  }

  .btn-danger:hover {
    background-color: #f9e6e6;
    border-color: var(--danger);
  }

  /* 注意書きボックス */
  .notice-box {
    background-color: var(--bg-notice);
    border: 1px solid var(--bg-notice-border);
    border-radius: 8px;
    padding: 14px 20px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .notice-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 1px;
    border: 1.5px solid var(--text-notice);
    border-radius: 50%;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-notice);
  }

  .notice-text {
    font-size: var(--fs-sm);
    color: var(--text-notice);
    line-height: 1.7;
  }

  .notice-text strong {
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="container">

    <!-- タイトル -->
    <div class="title-row">
      <h1 class="page-title">手数料率管理</h1>
      <span class="mode-indicator" id="mode-indicator"></span>
    </div>

    <!-- 入力エラー表示 -->
    <div id="form-error" role="alert"
         style="display:none; margin-bottom:12px; padding:10px 14px;
                border-radius:6px; background:#fdf4f4; border:1px solid #e6c4c4;
                color:#b33a3a; font-size:15px;"></div>

    <!-- フォーム -->
    <div class="form-box">
      <div class="form-section-title">手数料率情報</div>

      <!-- 編集対象を一意に識別する手数料率ID (送信用) -->
      <input type="hidden" id="fee-rate-id" th:value="${feeRate?.feeRateId}" />

      <div class="form-row">
        <div class="form-field">
          <label>決済会社 <span class="required">必須</span></label>
          <input type="text" id="fee-rate-company" maxlength="30"
                 th:value="${feeRate?.paymentCompany}"
                 placeholder="例: JCB" />
        </div>
        <div class="form-field">
          <label>カードブランド <span class="required">必須</span></label>
          <input type="text" id="fee-rate-brand" maxlength="30"
                 th:value="${feeRate?.cardBrand}"
                 placeholder="例: 【ＪＣＢカード】" />
          <div class="field-hint">各種精算データ作成の照合キーとして使用されます</div>
        </div>
        <div class="form-field">
          <label>計算モデル <span class="required">必須</span></label>
          <div class="select-wrap">
            <select id="fee-rate-calc-model">
              <option value="STRAIGHT" th:selected="${feeRate?.calcModel == 'STRAIGHT'}">直線式</option>
              <option value="PURCHASE_COLLECT" th:selected="${feeRate?.calcModel == 'PURCHASE_COLLECT'}">仕入・収代二段階式</option>
              <option value="SBI_RESIDUAL" th:selected="${feeRate?.calcModel == 'SBI_RESIDUAL'}">住信SBI残差式</option>
            </select>
            <svg class="select-arrow" width="10" height="10" viewBox="0 0 10 10"><path d="M1 3.5 L5 7 L9 3.5" stroke="#6b6b68" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>仕入手数料率</label>
          <input type="text" id="fee-rate-acquirer" class="mono"
                 th:value="${feeRate?.acquirerFeeRate}"
                 placeholder="例: 0.02750" />
          <div class="field-hint">
            小数で入力してください（例: 2.75%の場合は0.02750）。
            住信SBI残差式の場合は明細行の実績値を使用するため空欄可
          </div>
        </div>
        <div class="form-field">
          <label>当社手数料率(本体) <span class="required">必須</span></label>
          <input type="text" id="fee-rate-base" class="mono"
                 th:value="${feeRate?.ourFeeRateBase}"
                 placeholder="例: 0.00180" />
          <div class="field-hint">小数で入力してください（例: 0.18%の場合は0.00180）</div>
        </div>
        <div class="form-field">
          <label>当社手数料率(消費税)</label>
          <input type="text" id="fee-rate-tax" class="mono"
                 th:value="${feeRate?.ourFeeRateTax}"
                 placeholder="例: 0.00020" />
          <div class="field-hint">消費税分を分けない計算モデルの場合は空欄可</div>
        </div>
      </div>
    </div>

    <!-- アクションバー -->
    <div class="action-bar">
      <div class="action-left"></div>
      <div class="action-right">
        <button class="btn btn-cancel" type="button">戻る</button>
        <button class="btn btn-primary" type="button" id="submit-btn">更新</button>
        <button class="btn btn-danger" type="button" id="delete-btn">削除</button>
      </div>
    </div>

    <!-- 注意書きボックス -->
    <div class="notice-box">
      <span class="notice-icon">!</span>
      <div class="notice-text" id="notice-text">
        <strong>更新時のご注意:</strong>
        決済会社・カードブランドはJFTD精算・stera terminal精算の計算処理が照合キーとして
        参照します。変更する場合は他の行と重複しないか、計算処理への影響が無いか確認してください。
      </div>
    </div>

  </div>

  <script>
    // CSRF トークン。更新系の要求のヘッダーに設定して送信する。
    var csrfToken = document
        .querySelector('meta[name="csrf-token"]').getAttribute('content');

    // 各入力欄
    var feeRateIdInput = document.getElementById('fee-rate-id');
    var companyInput = document.getElementById('fee-rate-company');
    var brandInput = document.getElementById('fee-rate-brand');
    var calcModelSelect = document.getElementById('fee-rate-calc-model');
    var acquirerInput = document.getElementById('fee-rate-acquirer');
    var baseInput = document.getElementById('fee-rate-base');
    var taxInput = document.getElementById('fee-rate-tax');
    var formError = document.getElementById('form-error');
    var submitButton = document.getElementById('submit-btn');
    var deleteButton = document.getElementById('delete-btn');

    // 手数料率の形式チェック用 (サーバー側と同じ条件。NUMERIC(6,5)の範囲)
    var RATE_PATTERN = /^[0-9](\.[0-9]{1,5})?$/;

    // 登録モード (mode=new) と編集モード (既定) を URL で判定する
    var searchParams = new URLSearchParams(window.location.search);
    var mode = searchParams.get('mode') === 'new' ? 'new' : 'edit';

    // エラーメッセージの表示・非表示
    function showError(message) {
      formError.textContent = message;
      formError.style.display = 'block';
    }

    function hideError() {
      formError.style.display = 'none';
    }

    // 戻るボタン: 同じ枠 (iframe) 内で手数料率一覧へ戻る
    document.querySelector('.btn-cancel').addEventListener('click', function () {
      window.location.href = '/settlement_fee_rate_list';
    });

    // 入力チェック。問題があればメッセージを返す (問題なければ null)
    function validateForm() {
      if (companyInput.value.trim() === '') {
        return '決済会社を入力してください。';
      }
      if (companyInput.value.trim().length > 30) {
        return '決済会社は30文字以内で入力してください。';
      }
      if (brandInput.value.trim() === '') {
        return 'カードブランドを入力してください。';
      }
      if (brandInput.value.trim().length > 30) {
        return 'カードブランドは30文字以内で入力してください。';
      }
      var acquirer = acquirerInput.value.trim();
      if (acquirer !== '' && !RATE_PATTERN.test(acquirer)) {
        return '仕入手数料率は0以上10未満の数値で、小数点以下5桁までで入力してください。';
      }
      var base = baseInput.value.trim();
      if (base === '') {
        return '当社手数料率 (本体) を入力してください。';
      }
      if (!RATE_PATTERN.test(base)) {
        return '当社手数料率 (本体) は0以上10未満の数値で、小数点以下5桁までで入力してください。';
      }
      var tax = taxInput.value.trim();
      if (tax !== '' && !RATE_PATTERN.test(tax)) {
        return '当社手数料率 (消費税) は0以上10未満の数値で、小数点以下5桁までで入力してください。';
      }
      return null;
    }

    // 入力値を組み立ててサーバーへ保存要求を送る
    function saveFeeRate() {
      hideError();
      var validationMessage = validateForm();
      if (validationMessage !== null) {
        showError(validationMessage);
        return;
      }

      var payload = {
        mode: mode,
        feeRateId: feeRateIdInput.value ? parseInt(feeRateIdInput.value, 10) : 0,
        paymentCompany: companyInput.value.trim(),
        cardBrand: brandInput.value.trim(),
        calcModel: calcModelSelect.value,
        acquirerFeeRate: acquirerInput.value.trim(),
        ourFeeRateBase: baseInput.value.trim(),
        ourFeeRateTax: taxInput.value.trim()
      };

      submitButton.disabled = true;
      fetch('/settlement_fee_rate/save', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-TOKEN': csrfToken
        },
        body: JSON.stringify(payload)
      })
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          if (data.success) {
            window.location.href = '/settlement_fee_rate_list';
            return;
          }
          showError(data.message);
          submitButton.disabled = false;
        })
        .catch(function () {
          showError('通信エラーが発生しました。時間をおいて再度お試しください。');
          submitButton.disabled = false;
        });
    }

    // 手数料率を削除する
    function deleteFeeRate() {
      if (!window.confirm('この手数料率を削除しますか？')) {
        return;
      }
      hideError();
      deleteButton.disabled = true;
      fetch('/settlement_fee_rate/delete', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-TOKEN': csrfToken
        },
        body: JSON.stringify({
          feeRateId: parseInt(feeRateIdInput.value, 10)
        })
      })
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          if (data.success) {
            window.location.href = '/settlement_fee_rate_list';
            return;
          }
          showError(data.message);
          deleteButton.disabled = false;
        })
        .catch(function () {
          showError('通信エラーが発生しました。時間をおいて再度お試しください。');
          deleteButton.disabled = false;
        });
    }

    submitButton.addEventListener('click', saveFeeRate);
    deleteButton.addEventListener('click', deleteFeeRate);

    if (mode === 'new') {
      // 見出しに登録モードであることを示す
      document.getElementById('mode-indicator').textContent = '（登録モード）';

      // 登録モードでは削除対象が無いため削除ボタンを隠す
      deleteButton.hidden = true;

      // 実行ボタンを「登録」に変更する
      submitButton.textContent = '登録';

      // 注意書きを登録向けの内容に差し替える
      document.getElementById('notice-text').innerHTML =
          '<strong>登録時のご注意:</strong> '
          + '決済会社・カードブランドはJFTD精算・stera terminal精算の計算処理が照合キーとして'
          + '参照します。重複しない組み合わせを入力してください。';
    }
  </script>
</body>
</html>
