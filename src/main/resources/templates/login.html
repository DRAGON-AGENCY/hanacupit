<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<!-- CSRF トークン。更新系の要求でヘッダーに設定して送信する。 -->
<meta name="csrf-token" th:content="${csrfToken}" content="">
<script>
  // このログイン画面が iframe (メニュー画面のコンテンツ枠) 内に読み込まれた
  // 場合の対処。セッションタイムアウト時にインターセプターが iframe 内の
  // リクエストを /login へリダイレクトすると、サイドメニュー付きシェルの中に
  // ログイン画面が表示されてしまう。最上位ウィンドウごとログイン画面へ遷移し、
  // サイドメニューの無い通常のログイン画面を全画面で表示する。
  // 画面描画前に実行するため <head> の先頭に配置している。
  if (window.top !== window.self) {
    window.top.location.replace(window.location.href);
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | キャッシュレス管理システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 外部フォント CSS はレンダリングをブロックしないよう非同期で読み込む。 -->
<!-- 取得前でも代替フォントで即座に画面を表示し、応答性を確保する。 -->
<link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
    media="print" onload="this.media='all'">
<noscript>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
</noscript>
<style>
  :root {
    --bg-page: #ffffff;
    --bg-card: #FDF7F8;
    --bg-form: #FFDCE4;
    --bg-white: #ffffff;
    --bg-notice: #fbeed5;
    --bg-notice-border: #f1d9a0;
    --border-color: #e8e4da;
    --border-input: #d8d4c8;
    --border-form: #e2dcc8;
    --text-main: #2a2a2a;
    --text-sub: #4a4a4a;
    --text-label: #5a5a5a;
    --text-muted: #8a8a8a;
    --text-notice: #8a5a1a;
    --accent-blue: #3a6db5;
    --accent-blue-light: #e3edfb;
    --accent-blue-border: #b9d0ec;
    --accent-blue-hover: #d5e4f6;
    --error-red: #c64a4a;
    --error-bg: #fbeaea;
    --error-border: #f0c4c4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Inter", "Noto Sans JP", sans-serif;
    background-color: var(--bg-page);
    color: var(--text-main);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .login-container {
    width: 100%;
    max-width: 460px;
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 40px 44px 36px;
  }

  /* ヘッダー */
  .login-header {
    text-align: center;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 28px;
  }

  .system-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }

  .system-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  /* ログインフォームエリア */
  .login-form-box {
    background-color: var(--bg-form);
    border: 1px solid var(--border-form);
    border-radius: 8px;
    padding: 24px 26px 22px;
    margin-bottom: 20px;
  }

  .form-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }

  .form-label {
    font-size: 12px;
    color: var(--text-label);
  }

  .login-input {
    padding: 10px 14px;
    border: 1px solid var(--border-input);
    border-radius: 6px;
    background-color: var(--bg-white);
    font-size: 14px;
    color: var(--text-main);
    font-family: "Inter", "Noto Sans JP", sans-serif;
    width: 100%;
    transition: all 0.15s ease;
  }

  .login-input.jp {
    font-family: "Inter", "Noto Sans JP", sans-serif;
  }

  .login-input:focus {
    outline: none;
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 2px rgba(58, 109, 181, 0.15);
  }

  /* 入力チェックでエラーになった項目のハイライト */
  .login-input.input-error {
    border-color: var(--error-red);
    background-color: var(--error-bg);
  }

  .login-input.input-error:focus {
    border-color: var(--error-red);
    box-shadow: 0 0 0 2px rgba(198, 74, 74, 0.18);
  }

  /* パスワード表示切替 */
  .password-wrapper {
    position: relative;
  }

  .password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    font-size: 12px;
    color: var(--text-muted);
    font-family: inherit;
    border-radius: 4px;
    transition: all 0.15s ease;
  }

  .password-toggle:hover {
    background-color: rgba(0,0,0,0.04);
    color: var(--text-sub);
  }

  .login-input.has-toggle {
    padding-right: 56px;
  }

  /* ログインボタン */
  .btn-login {
    width: 100%;
    background-color: var(--accent-blue-light);
    border: 1px solid var(--accent-blue-border);
    color: var(--accent-blue);
    font-weight: 500;
    padding: 11px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-login:hover {
    background-color: var(--accent-blue-hover);
  }

  .btn-login:active {
    transform: translateY(1px);
  }

  /* エラーメッセージ (非表示状態) */
  .error-message {
    display: none;
    background-color: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--error-red);
    margin-bottom: 14px;
    align-items: center;
    gap: 8px;
  }

  .error-message.show {
    display: flex;
  }

  .error-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--error-red);
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* 注意書きボックス */
  .notice-box {
    background-color: var(--bg-notice);
    border: 1px solid var(--bg-notice-border);
    border-radius: 8px;
    padding: 14px 18px 16px;
  }

  .notice-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-notice);
    margin-bottom: 8px;
  }

  .notice-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--text-notice);
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
  }

  .notice-text {
    font-size: 12px;
    color: var(--text-notice);
    line-height: 1.7;
  }

  /* フッター */
  .login-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    body { padding: 16px 8px; }
    .login-container { padding: 28px 22px 24px; }
    .login-form-box { padding: 20px 18px; }
    .system-title { font-size: 19px; }
  }
</style>
</head>
<body>
  <div class="login-container">
    <!-- ヘッダー -->
    <div class="login-header">
      <h1 class="system-title">キャッシュレス管理システム</h1>
      <p class="system-subtitle">Cashless Management System</p>
    </div>

    <!-- エラーメッセージ -->
    <div class="error-message" id="error-message">
      <span class="error-icon">!</span>
      <span id="error-text">ユーザIDまたはパスワードが正しくありません。</span>
    </div>

    <!-- ログインフォーム -->
    <div class="login-form-box">
      <div class="form-field">
        <label class="form-label" for="userId">ユーザID</label>
        <input
          type="text"
          id="userId"
          class="login-input"
          placeholder="例: user001"
          autocomplete="username"
        />
      </div>

      <div class="form-field" style="margin-bottom: 22px">
        <label class="form-label" for="password">パスワード</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            class="login-input has-toggle"
            placeholder="パスワードを入力"
            autocomplete="current-password"
          />
          <button type="button" class="password-toggle" id="password-toggle">表示</button>
        </div>
      </div>

      <button type="button" class="btn-login" id="btn-login">
        <span>🔒</span><span>ログイン</span>
      </button>
    </div>

    <!-- 注意書き -->
    <div class="notice-box">
      <div class="notice-title">
        <span class="notice-icon">!</span>
        <span>ログイン時のご注意</span>
      </div>
      <p class="notice-text">
        パスワードを連続して5回間違えた場合、アカウントが一時的にロックされます。ログインできない場合は、システム管理者までお問い合わせください。
      </p>
    </div>

    <!-- フッター -->
    <div class="login-footer">
      © 2026 Cashless Management System. All rights reserved.
    </div>
  </div>

  <script>
    // CSRF トークン。更新系の要求のヘッダーに設定して送信する。
    const csrfToken = document
        .querySelector('meta[name="csrf-token"]').getAttribute('content');

    // パスワード表示切替
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('password-toggle');

    passwordToggle.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        passwordToggle.textContent = '隠す';
      } else {
        passwordInput.type = 'password';
        passwordToggle.textContent = '表示';
      }
    });

    // ログインフォームの入力チェック
    const userIdInput = document.getElementById('userId');
    const errorMessage = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    const btnLogin = document.getElementById('btn-login');

    function showError(text) {
      errorText.textContent = text;
      errorMessage.classList.add('show');
    }

    function hideError() {
      errorMessage.classList.remove('show');
    }

    // エラーになった入力欄にハイライトを付ける・解除する
    function setFieldError(input) {
      input.classList.add('input-error');
    }

    function clearFieldErrors() {
      userIdInput.classList.remove('input-error');
      passwordInput.classList.remove('input-error');
    }

    // ユーザIDの入力チェック (チェック1)
    // 戻り値: エラーメッセージ。問題が無ければ null
    function validateUserId(userId) {
      // 未入力 (半角・全角スペースのみはトリム後に空文字となる)
      if (userId === '') {
        return 'ユーザIDを入力してください。';
      }
      // 全角文字 (ASCII 以外) が含まれる
      if (/[^\x00-\x7F]/.test(userId)) {
        return 'ユーザIDは半角で入力してください。';
      }
      // 使用できない文字 (許可するのは半角英数字)
      if (/[^A-Za-z0-9]/.test(userId)) {
        return 'ユーザIDに使用できない文字が含まれています。'
            + '半角英数字で入力してください。';
      }
      // 文字数の上限超過
      if (userId.length > 20) {
        return 'ユーザIDは20文字以内で入力してください。';
      }
      return null;
    }

    // パスワードの入力チェック (チェック2)
    // 戻り値: エラーメッセージ。問題が無ければ null
    // ※ログイン時は未入力のみを確認する。桁数・文字種・複雑性の検査は
    //   登録／変更時の責務であり、ログイン時に課すと既存パスワードでの
    //   ログインを妨げるため行わない。実際の正否はサーバーで m_employee の
    //   ユーザIDと照合して判定する。
    function validatePassword(password) {
      // 未入力 (半角・全角スペースのみは空とみなす)
      if (password.trim() === '') {
        return 'パスワードを入力してください。';
      }
      return null;
    }

    btnLogin.addEventListener('click', () => {
      hideError();
      clearFieldErrors();

      // ユーザIDは前後の空白をトリムし、入力欄にも反映する
      const userId = userIdInput.value.trim();
      userIdInput.value = userId;
      const password = passwordInput.value;

      // チェック2 No.9: ユーザIDとパスワードがどちらも未入力
      if (userId === '' && password.trim() === '') {
        showError('ユーザIDとパスワードを入力してください。');
        setFieldError(userIdInput);
        setFieldError(passwordInput);
        userIdInput.focus();
        return;
      }

      const userIdError = validateUserId(userId);
      if (userIdError !== null) {
        showError(userIdError);
        setFieldError(userIdInput);
        userIdInput.focus();
        return;
      }

      const passwordError = validatePassword(password);
      if (passwordError !== null) {
        showError(passwordError);
        setFieldError(passwordInput);
        passwordInput.focus();
        return;
      }

      // 形式チェック通過後、サーバーで m_employee の登録内容と照合する
      authenticateWithServer(userId, password);
    });

    // ユーザIDとパスワードをサーバーへ送信し、m_employee との
    // 照合結果に応じてメニューへ遷移、またはエラーメッセージを表示する。
    // チェック1 No.18-20 (未登録・無効・ロック中) はサーバー側で判定する。
    function authenticateWithServer(userId, password) {
      btnLogin.disabled = true;
      fetch('/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-TOKEN': csrfToken
        },
        body: JSON.stringify({ userId: userId, password: password })
      })
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          if (data.success) {
            // iframe (メニュー画面のコンテンツ枠) 内に表示されている場合でも
            // 最上位ウィンドウを遷移させ、メニュー画面が入れ子にならないようにする
            window.top.location.href = '/menu';
            return;
          }
          showError(data.message);
          setFieldError(userIdInput);
          setFieldError(passwordInput);
          btnLogin.disabled = false;
        })
        .catch(function () {
          showError('通信エラーが発生しました。時間をおいて再度お試しください。');
          btnLogin.disabled = false;
        });
    }

    // Enterキーでログイン
    [userIdInput, passwordInput].forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          btnLogin.click();
        }
      });
      // 再入力されたらエラー表示とハイライトを解除する
      input.addEventListener('input', () => {
        hideError();
        clearFieldErrors();
      });
    });

    // ログイン画面を起動時の初期表示に戻す
    // ログアウト後の再表示やブラウザの戻る操作 (bfcache) による復元も含めて初期化する
    function resetLoginForm() {
      userIdInput.value = '';
      passwordInput.value = '';
      passwordInput.type = 'password';
      passwordToggle.textContent = '表示';
      hideError();
      clearFieldErrors();
    }

    window.addEventListener('pageshow', resetLoginForm);
  </script>
</body>
</html>
