<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャッシュレス管理システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 外部 CSS はレンダリングをブロックしないよう非同期で読み込む。 -->
<!-- 取得前でも代替フォントで即座に画面を表示し、応答性を確保する。 -->
<!-- (media="print" で初回はブロッキング対象外とし、読み込み完了後に all へ切り替える) -->
<link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css"
    media="print" onload="this.media='all'">
<link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
    media="print" onload="this.media='all'">
<noscript>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
</noscript>
<style>
  :root {
    /* === 色トークン (他画面と統一) === */
    --bg-page: #ffffff;
    --bg-card: #FDF7F8;
    --bg-white: #ffffff;
    --bg-secondary: #f1efe8;
    --bg-hover: #ede8db;
    --border-color: #e8e4da;
    --border-input: #d8d4c8;
    --text-main: #2a2a2a;
    --text-sub: #4a4a4a;
    --text-muted: #8a8a8a;
    --text-label: #5a5a5a;

    --color-blue-50: #e3edfb;
    --color-blue-600: #3a6db5;
    --color-blue-800: #2b5fa8;
    --color-blue-accent: #3a6db5;
    --color-green-50: #dcead9;
    --color-green-600: #3d6b3a;
    --color-green-800: #2f5a2c;
    --color-green-accent: #639922;

    /* === フォントトークン === */
    --font-base: "Inter", "Noto Sans JP", sans-serif;

    /* === フォントサイズトークン === */
    --fs-xs: 14px;
    --fs-sm: 15px;
    --fs-base: 16px;
    --fs-md: 18px;
    --fs-lg: 22px;

    /* === レイアウトトークン === */
    --container-min: 1200px;
    --sidebar-width: 400px;

    /* === その他 === */
    --radius-md: 8px;
    --radius-pill: 999px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  [hidden] {
    display: none !important;
  }

  html, body {
    height: 100vh;
  }

  body {
    font-family: var(--font-base);
    background-color: var(--bg-page);
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
    font-size: var(--fs-base);
    font-feature-settings: "palt";
    line-height: 1.6;
    overflow-x: auto;
    overflow-y: hidden;
  }

  /* === アプリ全体のシェル (左サイドバー + 右コンテンツ) === */
  .app-shell {
    display: flex;
    height: 100vh;
    min-width: var(--container-min);
  }

  /* === 左サイドバー === */
  .sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    height: 100vh;
    background-color: var(--bg-card);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
  }

  .sidebar-header {
    flex-shrink: 0;
    padding: 14px 22px 12px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sidebar-header-titles {
    min-width: 0;
  }

  /* ログアウトボタン */
  .logout-button {
    align-self: flex-end;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border: 1px solid var(--border-input);
    border-radius: var(--radius-pill);
    background: var(--bg-white);
    color: var(--text-sub);
    font-family: inherit;
    font-size: var(--fs-xs);
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .logout-button:hover {
    background: var(--bg-secondary);
    color: var(--text-main);
  }

  .logout-button:focus-visible {
    outline: 2px solid var(--color-blue-accent);
    outline-offset: 1px;
  }

  .logout-button .ti {
    font-size: 16px;
  }

  .sidebar-header .eyebrow {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    margin: 2px 0 0;
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  .sidebar-header h1 {
    margin: 0;
    font-size: var(--fs-lg);
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  /* === ナビゲーション (スクロール領域) === */
  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 24px;
  }

  .sidebar-nav::-webkit-scrollbar {
    width: 12px;
  }

  .sidebar-nav::-webkit-scrollbar-track {
    background: var(--bg-card);
  }

  .sidebar-nav::-webkit-scrollbar-thumb {
    background: #c9c4b4;
    border: 3px solid var(--bg-card);
    border-radius: 8px;
  }

  .sidebar-nav::-webkit-scrollbar-thumb:hover {
    background: #aea892;
  }

  .nav-group + .nav-group {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border-color);
  }

  .group-head {
    margin-bottom: 14px;
    padding-left: 4px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: var(--fs-base);
    padding: 4px 14px;
    border-radius: var(--radius-pill);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .badge.inquiry {
    background: #FFDCE4;
    color: var(--color-blue-800);
  }

  .badge.operation {
    background: #EEF3FA;
    color: var(--color-green-600);
  }

  .badge.management {
    background: #FAEEDA;
    color: #854f0b;
  }

  /* === サブグループ (会員情報 / 店舗・端末情報 / 精算情報) === */
  .nav-sub {
    margin-bottom: 14px;
  }

  .nav-sub:last-child {
    margin-bottom: 0;
  }

  .sub-label {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-sub);
    letter-spacing: 0.04em;
    margin: 0 0 8px;
    padding-left: 8px;
  }

  .menu-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 12px;
    border: none;
    border-radius: var(--radius-md);
    background: transparent;
    font-family: inherit;
    font-size: var(--fs-sm);
    color: var(--text-main);
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
    font-weight: 500;
  }

  .menu-item:hover {
    background: var(--bg-secondary);
  }

  .menu-item:focus-visible {
    outline: 2px solid var(--color-blue-accent);
    outline-offset: 1px;
  }

  .menu-item .item-icon {
    font-size: 18px;
    flex-shrink: 0;
    color: var(--text-muted);
    transition: color 0.15s ease;
  }

  .menu-item .item-text {
    flex: 1;
    min-width: 0;
    line-height: 1.4;
  }

  .menu-item .sub {
    font-size: var(--fs-xs);
    color: var(--text-sub);
    margin-left: 4px;
    font-weight: 400;
  }

  .menu-item .arrow {
    font-size: 16px;
    flex-shrink: 0;
    color: var(--text-muted);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .menu-item:hover .arrow,
  .menu-item.active .arrow {
    opacity: 0.7;
  }

  /* 照会機能 (青系) のホバー・選択 */
  .nav-group[data-group="inquiry"] .menu-item:hover .item-icon,
  .nav-group[data-group="inquiry"] .menu-item.active .item-icon {
    color: var(--color-blue-600);
  }

  .nav-group[data-group="inquiry"] .menu-item.active {
    background: #FFDCE4;
    color: var(--color-blue-800);
    box-shadow: inset 3px 0 0 var(--color-blue-accent);
    font-weight: 600;
  }

  /* 運用機能 (緑系) のホバー・選択 */
  .nav-group[data-group="operation"] .menu-item:hover .item-icon,
  .nav-group[data-group="operation"] .menu-item.active .item-icon {
    color: var(--color-green-600);
  }

  .nav-group[data-group="operation"] .menu-item.active {
    background: #EEF3FA;
    color: var(--color-green-600);
    box-shadow: inset 3px 0 0 var(--color-green-accent);
    font-weight: 600;
  }

  /* 管理機能 (アンバー系) のホバー・選択 */
  .nav-group[data-group="management"] .menu-item:hover .item-icon,
  .nav-group[data-group="management"] .menu-item.active .item-icon {
    color: #b07a28;
  }

  .nav-group[data-group="management"] .menu-item.active {
    background: #FAEEDA;
    color: #854f0b;
    box-shadow: inset 3px 0 0 #c08a3e;
    font-weight: 600;
  }

  /* === 右コンテンツエリア === */
  .main {
    flex: 1;
    min-width: 0;
    height: 100vh;
    position: relative;
    background-color: var(--bg-page);
  }

  .content-frame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .placeholder-inner {
    color: var(--text-muted);
  }

  .placeholder-inner .ti {
    font-size: 56px;
    color: #cbc5b5;
  }

  .placeholder-inner p {
    margin-top: 12px;
    font-size: var(--fs-md);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <header class="sidebar-header">
      <div class="sidebar-header-titles">
        <h1>キャッシュレス管理システム</h1>
        <p class="eyebrow">CASHLESS MANAGEMENT</p>
      </div>
      <button type="button" class="logout-button" id="logout-button">
        <i class="ti ti-logout" aria-hidden="true"></i>
        <span>ログアウト</span>
      </button>
    </header>

    <nav class="sidebar-nav">

      <section class="nav-group" data-group="inquiry">
        <div class="group-head">
          <span class="badge inquiry"><i class="ti ti-search" aria-hidden="true"></i>照会機能</span>
        </div>

        <div class="nav-sub">
          <p class="sub-label">会員情報</p>
          <div class="menu-list">
            <button type="button" class="menu-item" data-src="/member_list?mode=member_info">
              <i class="ti ti-user item-icon" aria-hidden="true"></i>
              <span class="item-text">会員情報照会</span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
            <button type="button" class="menu-item" data-src="/paygate_mapping_info">
              <i class="ti ti-link item-icon" aria-hidden="true"></i>
              <span class="item-text">取引コード紐付情報照会</span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="nav-sub">
          <p class="sub-label">店舗・端末情報</p>
          <div class="menu-list">
            <button type="button" class="menu-item" data-src="/member_list?mode=store_terminal_smcc">
              <i class="ti ti-building-store item-icon" aria-hidden="true"></i>
              <span class="item-text">店舗・端末・SMCC加盟店番号情報照会</span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="nav-sub">
          <p class="sub-label">精算情報</p>
          <div class="menu-list">
            <button type="button" class="menu-item" data-src="/paygate_station">
              <i class="ti ti-receipt item-icon" aria-hidden="true"></i>
              <span class="item-text">PAYGATE Station 精算情報照会</span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
            <button type="button" class="menu-item" data-src="/stera_jcb">
              <i class="ti ti-credit-card item-icon" aria-hidden="true"></i>
              <span class="item-text">stera terminal 精算情報照会<span class="sub">(JCB)</span></span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
            <button type="button" class="menu-item" data-src="/stera_smcc">
              <i class="ti ti-credit-card item-icon" aria-hidden="true"></i>
              <span class="item-text">stera terminal 精算情報照会<span class="sub">(SMCC)</span></span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </section>

      <section class="nav-group" data-group="operation">
        <div class="group-head">
          <span class="badge operation"><i class="ti ti-settings" aria-hidden="true"></i>運用機能</span>
        </div>

        <div class="nav-sub">
          <p class="sub-label">会員情報</p>
          <div class="menu-list">
            <button type="button" class="menu-item" data-src="/member_master">
              <i class="ti ti-database item-icon" aria-hidden="true"></i>
              <span class="item-text">加盟会員店マスターデータ 登録・更新</span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
            <button type="button" class="menu-item" data-src="/application_form">
              <i class="ti ti-file-text item-icon" aria-hidden="true"></i>
              <span class="item-text">各決済会社所定申込フォーム作成</span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
            <button type="button" class="menu-item" data-src="/paygate_mapping_create">
              <i class="ti ti-table-import item-icon" aria-hidden="true"></i>
              <span class="item-text">取引コード紐付データ作成</span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="nav-sub">
          <p class="sub-label">店舗・端末情報</p>
          <div class="menu-list">
            <button type="button" class="menu-item" data-src="/shop_data_create">
              <i class="ti ti-device-desktop item-icon" aria-hidden="true"></i>
              <span class="item-text">店舗・端末・加盟店番号データ作成</span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div class="nav-sub">
          <p class="sub-label">精算情報</p>
          <div class="menu-list">
            <button type="button" class="menu-item" data-src="/jftd_settlement">
              <i class="ti ti-file-spreadsheet item-icon" aria-hidden="true"></i>
              <span class="item-text">JFTD精算データ作成<span class="sub">(PAYGATE Station)</span></span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
            <button type="button" class="menu-item" data-src="/other_settlement">
              <i class="ti ti-file-spreadsheet item-icon" aria-hidden="true"></i>
              <span class="item-text">その他精算データ作成<span class="sub">(stera terminal)</span></span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
            <button type="button" class="menu-item" data-src="/jftd_transfer">
              <i class="ti ti-file-export item-icon" aria-hidden="true"></i>
              <span class="item-text">JFTD・その他統合振込CSV作成</span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
            <button type="button" class="menu-item" data-src="/jftd_report">
              <i class="ti ti-report item-icon" aria-hidden="true"></i>
              <span class="item-text">帳票出力</span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </section>

      <section class="nav-group" data-group="management">
        <div class="group-head">
          <span class="badge management"><i class="ti ti-shield-cog" aria-hidden="true"></i>管理機能</span>
        </div>

        <div class="nav-sub">
          <div class="menu-list">
            <button type="button" class="menu-item" data-src="/employee_list">
              <i class="ti ti-users item-icon" aria-hidden="true"></i>
              <span class="item-text">社員管理</span>
              <i class="ti ti-chevron-right arrow" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </section>

    </nav>

  </aside>

  <main class="main">
    <div class="placeholder" id="placeholder">
      <div class="placeholder-inner">
        <i class="ti ti-layout-sidebar-left-expand" aria-hidden="true"></i>
        <p>左のメニューから機能を選択してください</p>
      </div>
    </div>
    <iframe class="content-frame" id="content-frame" title="機能画面" hidden></iframe>
  </main>

</div>

<script>
  // 左メニューの項目をクリックすると、右コンテンツ (iframe) に該当画面を表示する
  const frame = document.getElementById('content-frame');
  const placeholder = document.getElementById('placeholder');
  const menuItems = document.querySelectorAll('.menu-item');

  menuItems.forEach((item) => {
    item.addEventListener('click', () => {
      menuItems.forEach((other) => other.classList.remove('active'));
      item.classList.add('active');
      frame.src = item.dataset.src;
      placeholder.hidden = true;
      frame.hidden = false;
    });
  });

  // ログアウトボタン: 確認のうえセッションを破棄してログイン画面へ戻る
  const logoutButton = document.getElementById('logout-button');
  if (logoutButton) {
    logoutButton.addEventListener('click', () => {
      if (window.confirm('ログアウトしますか？')) {
        window.location.href = '/logout';
      }
    });
  }
</script>

</body>
</html>
