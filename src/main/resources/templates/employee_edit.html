<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社員情報 編集 | キャッシュレス管理システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<style>
  :root {
    /* === 色トークン (他画面と統一) === */
    --bg-page: #ffffff;
    --bg-card: #ffffff;
    --bg-form: #fbf4e7;
    --bg-label: #ede8db;
    --bg-white: #ffffff;
    --bg-hover: #faf8f2;
    --bg-readonly: #f1efe8;
    --bg-notice: #fbeed5;
    --bg-notice-border: #f1d9a0;
    --border-color: #e8e4da;
    --border-input: #d8d4c8;
    --border-form: #ecd9b0;
    --border-table: #e5e2d8;
    --text-main: #2a2a2a;
    --text-sub: #4a4a4a;
    --text-label: #5a5a5a;
    --text-muted: #8a8a8a;
    --text-notice: #8a5a1a;
    --accent: #b07a28;
    --accent-light: #faeeda;
    --accent-border: #ecd9b0;
    --danger: #b33a3a;
    --danger-light: #fdf4f4;
    --danger-border: #e6c4c4;

    /* === フォントトークン === */
    --font-jp: "Inter", "Noto Sans JP", sans-serif;
    --font-base: "Inter", "Noto Sans JP", sans-serif;
    --font-mono: "SFMono-Regular", "Consolas", "Menlo", monospace;

    /* === フォントサイズトークン === */
    --fs-xs: 14px;
    --fs-sm: 15px;
    --fs-base: 16px;
    --fs-md: 18px;
    --fs-lg: 22px;

    /* === レイアウトトークン === */
    --container-min: 1200px;
    --container-max: 1760px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  [hidden] {
    display: none !important;
  }

  html, body {
    min-height: 100vh;
  }

  body {
    font-family: var(--font-base);
    background-color: var(--bg-page);
    color: var(--text-main);
    padding: 0;
    min-height: 100vh;
    overflow-x: auto;
    overflow-y: auto;
    -webkit-font-smoothing: antialiased;
    font-size: var(--fs-base);
    font-feature-settings: "palt";
  }

  .container {
    min-width: var(--container-min);
    max-width: var(--container-max);
    width: 100%;
    margin: 0 auto;
    background-color: var(--bg-card);
    border: none;
    border-radius: 0;
    padding: 10px 32px 14px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ページ全体のカスタムスクロールバー */
  body::-webkit-scrollbar {
    width: 14px;
  }

  body::-webkit-scrollbar-track {
    background: var(--bg-page);
    border-left: 1px solid var(--border-table);
  }

  body::-webkit-scrollbar-thumb {
    background: #c9c4b4;
    border: 3px solid var(--bg-page);
    border-radius: 8px;
  }

  body::-webkit-scrollbar-thumb:hover {
    background: #aea892;
  }

  /* ヘッダー */
  .header-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 6px;
  }

  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background-color: var(--bg-white);
    border: 1px solid var(--border-input);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: var(--fs-base);
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .btn-back:hover {
    background-color: var(--bg-hover);
    border-color: #c4bfae;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 14px;
  }

  .page-title {
    font-size: var(--fs-lg);
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: 0.01em;
  }

  .mode-indicator {
    font-size: var(--fs-sm);
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .mode-indicator:empty {
    display: none;
  }

  /* フォームエリア */
  .form-box {
    background-color: var(--bg-form);
    border: 1px solid var(--border-form);
    border-radius: 8px;
    padding: 18px 22px;
    margin-bottom: 14px;
  }

  .form-section-title {
    font-size: var(--fs-sm);
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--accent-border);
    letter-spacing: 0.02em;
  }

  .form-row {
    display: flex;
    gap: 18px;
    margin-bottom: 18px;
  }

  .form-row:last-child {
    margin-bottom: 0;
  }

  .form-field {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-field label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: var(--fs-xs);
    font-weight: 600;
    color: var(--text-label);
    letter-spacing: 0.03em;
  }

  .required {
    font-size: 12px;
    color: var(--danger);
    background: var(--danger-light);
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }

  .form-field input,
  .form-field select {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--border-input);
    border-radius: 6px;
    background-color: var(--bg-white);
    font-size: var(--fs-base);
    font-family: var(--font-jp);
    color: var(--text-main);
    appearance: none;
    -webkit-appearance: none;
  }

  .form-field input:focus,
  .form-field select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(176, 122, 40, 0.15);
  }

  .form-field input.mono {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .form-field input[readonly] {
    background-color: var(--bg-readonly);
    color: var(--text-muted);
  }

  .field-hint {
    font-size: 12px;
    color: var(--text-muted);
  }

  .select-wrap {
    position: relative;
  }

  .select-wrap .select-arrow {
    position: absolute;
    right: 14px;
    top: 15px;
    pointer-events: none;
  }

  /* アクションバー */
  .action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: var(--bg-white);
    border: 1px solid var(--border-table);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 14px;
  }

  .action-left,
  .action-right {
    display: flex;
    gap: 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 20px;
    border-radius: 6px;
    font-size: var(--fs-base);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
    border: 1px solid var(--border-input);
    background-color: var(--bg-white);
    color: var(--text-main);
    font-weight: 500;
  }

  .btn:hover {
    background-color: var(--bg-hover);
    border-color: #c4bfae;
  }

  .btn-primary {
    background-color: var(--accent-light);
    border-color: var(--accent-border);
    color: var(--accent);
  }

  .btn-primary:hover {
    background-color: #f3e2c4;
    border-color: var(--accent);
  }

  .btn-danger {
    background-color: var(--danger-light);
    border-color: var(--danger-border);
    color: var(--danger);
  }

  .btn-danger:hover {
    background-color: #f9e6e6;
    border-color: var(--danger);
  }

  /* 注意書きボックス */
  .notice-box {
    background-color: var(--bg-notice);
    border: 1px solid var(--bg-notice-border);
    border-radius: 8px;
    padding: 14px 20px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .notice-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 1px;
    border: 1.5px solid var(--text-notice);
    border-radius: 50%;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-notice);
  }

  .notice-text {
    font-size: var(--fs-sm);
    color: var(--text-notice);
    line-height: 1.7;
  }

  .notice-text strong {
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="container">

    <!-- ログアウトボタン -->
    <div class="header-row">
      <button class="btn-back" type="button">
        <span>ログアウト</span>
      </button>
    </div>

    <!-- タイトル -->
    <div class="title-row">
      <h1 class="page-title">社員管理</h1>
      <span class="mode-indicator" id="mode-indicator"></span>
    </div>

    <!-- フォーム -->
    <div class="form-box">
      <div class="form-section-title">基本情報</div>

      <div class="form-row">
        <div class="form-field">
          <label>社員番号 <span class="required">必須</span></label>
          <input type="text" id="employee-number" class="mono" value="S001"
                 placeholder="自動採番されます" readonly />
          <div class="field-hint">自動採番されます</div>
        </div>
        <div class="form-field">
          <label>社員名 <span class="required">必須</span></label>
          <input type="text" id="employee-name" value="田中 一郎"
                 placeholder="社員名を入力" />
        </div>
        <div class="form-field">
          <label>社員名 (カナ) <span class="required">必須</span></label>
          <input type="text" id="employee-kana" value="タナカ イチロウ"
                 placeholder="社員名カナを入力" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label>部署 <span class="required">必須</span></label>
          <div class="select-wrap">
            <select id="employee-dept">
              <option>営業部</option>
              <option>システム開発部</option>
              <option>経理部</option>
              <option>総務部</option>
            </select>
            <svg class="select-arrow" width="10" height="10" viewBox="0 0 10 10"><path d="M1 3.5 L5 7 L9 3.5" stroke="#6b6b68" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
          </div>
        </div>
        <div class="form-field">
          <label>電話番号 <span class="required">必須</span></label>
          <input type="text" id="employee-tel" class="mono" value="03-1234-5678"
                 placeholder="03-0000-0000" />
          <div class="field-hint">半角数字とハイフンで入力してください</div>
        </div>
        <div class="form-field">
          <label>FAX</label>
          <input type="text" id="employee-fax" class="mono" value="03-1234-5679"
                 placeholder="03-0000-0000" />
          <div class="field-hint">任意項目です</div>
        </div>
      </div>
    </div>

    <!-- アクションバー -->
    <div class="action-bar">
      <div class="action-left">
        <button class="btn" type="button" id="clear-btn" hidden>クリア</button>
      </div>
      <div class="action-right">
        <button class="btn btn-cancel" type="button">戻る</button>
        <button class="btn btn-primary" type="button" id="submit-btn">更新</button>
        <button class="btn btn-danger" type="button" id="delete-btn">削除</button>
      </div>
    </div>

    <!-- 注意書きボックス -->
    <div class="notice-box">
      <span class="notice-icon">!</span>
      <div class="notice-text" id="notice-text">
        <strong>更新時のご注意:</strong>
        社員番号は自動採番のため変更できません。
      </div>
    </div>

  </div>

  <script>
    // ログアウトボタン: ログイン画面へ遷移
    document.querySelector('.btn-back').addEventListener('click', function () {
      window.top.location.href = '/login';
    });

    // 戻るボタン: 同じ枠 (iframe) 内で社員一覧へ戻る
    document.querySelector('.btn-cancel').addEventListener('click', function () {
      window.location.href = '/employee_list';
    });

    // 入力欄をすべて空に戻す (登録モードの初期化とクリアボタンで共用)
    function clearEmployeeForm() {
      document.getElementById('employee-number').value = '';
      document.getElementById('employee-name').value = '';
      document.getElementById('employee-kana').value = '';
      document.getElementById('employee-dept').selectedIndex = 0;
      document.getElementById('employee-tel').value = '';
      document.getElementById('employee-fax').value = '';
      document.getElementById('employee-name').focus();
    }

    // URLのmodeパラメータで「登録モード」と「編集モード」を切り替える
    // 登録モード (mode=new): 空のフォームで新規社員を登録する
    // 編集モード (既定):     一覧で選択した社員の内容を更新する
    var searchParams = new URLSearchParams(window.location.search);
    var mode = searchParams.get('mode');

    if (mode === 'new') {
      // 見出しに登録モードであることを示す
      document.getElementById('mode-indicator').textContent = '（登録モード）';

      // 入力欄を空にして新規入力に備える
      clearEmployeeForm();

      // 登録モードでは削除対象が無いため削除ボタンを隠し、
      // 代わりに入力内容を消去するクリアボタンを表示する
      document.getElementById('delete-btn').hidden = true;
      document.getElementById('clear-btn').hidden = false;

      // クリアボタン: 入力内容をすべて消去する
      document.getElementById('clear-btn').addEventListener('click', function () {
        clearEmployeeForm();
      });

      // 実行ボタンを「登録」に変更する
      document.getElementById('submit-btn').textContent = '登録';

      // 注意書きを登録向けの内容に差し替える
      document.getElementById('notice-text').innerHTML =
          '<strong>登録時のご注意:</strong> '
          + '社員番号は登録時に自動採番されます。';
    } else {
      // 編集モードでは削除ボタンを表示する (既定の表示のまま)
      // 一覧で選択した社員番号を社員番号欄へ反映する
      var employeeNumber = searchParams.get('employeeNumber');
      if (employeeNumber) {
        document.getElementById('employee-number').value = employeeNumber;
      }
    }
  </script>
</body>
</html>
